name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test workspace contracts
        run: cargo test --workspace --all-targets
      - name: Install Stellar CLI
        run: |
          curl -sSLf https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli_28.1.0_amd64.deb -o stellar-cli.deb
          sudo dpkg -i stellar-cli.deb
          rm stellar-cli.deb
      - name: Build Soroban contracts
        run: |
          stellar contract build --package vault_core --target wasm32v1-none
          stellar contract build --package stream_factory --target wasm32v1-none
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build TypeScript packages and dashboard
        run: pnpm build
      - name: Run TypeScript unit tests
        run: pnpm test

